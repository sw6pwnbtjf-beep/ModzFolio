<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modzfolio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #252525 0%, #111111 45%, #070707 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .container {
      max-width: 700px;
    }
.brand-logo {
  width: min(90vw, 500px);
  height: auto;
  display: block;
  margin: 0 auto 30px;
}
    .logo {
      font-size: clamp(48px, 10vw, 88px);
      font-weight: 900;
      letter-spacing: -4px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .logo span {
      color: #9cff57;
    }

    .tagline {
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 600;
      margin-bottom: 18px;
    }

    .description {
      color: #aaaaaa;
      font-size: 17px;
      line-height: 1.6;
      max-width: 540px;
      margin: 0 auto 35px;
    }

    .coming-soon {
      display: inline-block;
      border: 1px solid #444;
      border-radius: 100px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #9cff57;
    }

    .social {
      margin-top: 35px;
      font-size: 15px;
    }

    .social a {
      color: white;
      text-decoration: none;
      opacity: 0.7;
    }

    .social a:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

  <main class="container">

   <img src="modzfolio-logo.jpeg" alt="Modzfolio Logo" class="brand-logo">

    <div class="tagline">
      Your build. Your mods. One place.
    </div>

    <p class="description">
      A new home for automotive enthusiasts to document,
      organize, and showcase their builds.
    </p>

    <div class="coming-soon">
      Coming Soon
    </div>

    <div class="social">
      <a href="https://instagram.com/modzfolio">
        @modzfolio
      </a>
    </div>

  </main>

</body>
</html>
